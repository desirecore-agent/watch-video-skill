name: Bug report
description: Report a reproducible problem using public or synthetic media
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private media, transcripts, cookies, tokens, or signed URLs.
  - type: input
    id: runtime
    attributes:
      label: Agent runtime and version
      placeholder: Codex, Claude Code, or another compatible runtime
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS, Linux, or WSL
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a public or synthetic media source.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
